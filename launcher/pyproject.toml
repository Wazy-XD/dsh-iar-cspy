[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-iar-launcher"
version = "1.0.0"
description = "Stable launcher for the official IAR C-SPY MCP server used by the dsh-iar-cspy DeepSeek Harness bundle"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wazy-XD" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/Wazy-XD/dsh-iar-cspy"

[tool.setuptools.packages.find]
include = ["dsh_iar_launcher*"]
