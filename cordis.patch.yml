- insert:
    - id: iar-cspy
      name: 'dsh-iar-cspy'
      config:
        iarPath: ''
        mcpPython: ''
        tempDir: ''
        toolCallTimeoutMs: 600000
        extraArgs: []
    - id: iar-cspy-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      inject: ['iarCspyConfig']
      config:
        serverName: iar
        transport: stdio
        command: !!js ctx.iarCspyConfig.command
        args: !!js ctx.iarCspyConfig.args
        env: !!js ctx.iarCspyConfig.env
        toolCallTimeoutMs: !!js ctx.iarCspyConfig.timeout
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 50
