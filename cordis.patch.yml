- insert:
    - id: iar-cspy
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: iar
        transport: stdio
        command: !!js 'process.platform === "win32" ? `${process.env.LOCALAPPDATA}\\dsh-iar-cspy\\venv\\Scripts\\python.exe` : "python3"'
        args: ['-m', 'dsh_iar_launcher']
        toolCallTimeoutMs: 600000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 50
